<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>POSOQO | Terminal Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root { --bg: #000; --card: #111; --gold: #F59E0B; --text: #FFF; --green:#10B981; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 14px; display: flex; justify-content: center;}
    .container { width: 100%; max-width: 440px; }
    .brand-logo { display:block; width:min(190px,70vw); height:auto; margin:0 auto; object-fit:contain; }
    .box { background: var(--card); border: 1px solid #333; border-radius: 20px; padding: 20px; margin-bottom: 20px;}
    input { width: 100%; background: #222; border: 1px solid #444; border-radius: 10px; padding: 15px; color: #FFF; text-align: center; margin-bottom: 12px; font-size: 1rem;}
    button { width: 100%; padding: 13px; border-radius: 10px; font-weight: 800; border: none; cursor: pointer; font-size: .95rem; margin-bottom: 10px; }
    .btn-gold { background: var(--gold); color: #000; }
    .btn-outline { background: transparent; border: 1px solid #555; color: #FFF; }
    .btn-green { background: var(--green); color: #000; padding: 15px;}
    .stat-box { background: #222; padding: 15px; border-radius: 10px; text-align: center; border: 1px dashed #555; margin-bottom: 15px;}
    .beer-pending { color:#ffc65b; font-size:.82rem; font-weight:800; margin:0 0 10px; }
    .beer-celebrate { animation: beerCelebrate .8s ease 2; border-color:#f5a623 !important; box-shadow:0 0 22px rgba(245,166,35,.35); }
    @keyframes beerCelebrate { 0%,100%{transform:scale(1)} 45%{transform:scale(1.025)} 70%{transform:scale(.99)} }
    .stat-box h4 { margin: 0 0 5px 0; color: var(--gold); font-size: 1.1rem; }
    .stat-box p { margin: 0 0 10px 0; font-size: 1.5rem; font-weight: 800; }
    .grid-botones { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .cafe-admin { padding: 15px; border: 1px solid #6d4a12; border-radius: 14px; background: #0c0c0c; margin-bottom: 15px;}
    .cafe-admin h3 { margin: 0 0 8px; color: var(--gold); font-size: 1.02rem; }
    .cafe-admin-status { padding: 10px; border-radius: 10px; font-size: .82rem; background: #202020; color: #eee; margin-bottom: 10px; }
    #reader { width:100%; overflow:hidden; border-radius:14px; background:#050505; margin:12px 0; }
    .hidden { display: none !important; }
  </style>
</head>

  <div id="pantallaLogin" class="box">
    <input type="password" id="txtPin" placeholder="PIN Personal Barra" inputmode="numeric">
    <button class="btn-gold" onclick="iniciarSesion()">Acceder</button>
  </div>

  <div id="pantallaEspera" class="box hidden">
    <div id="reader"></div>
    <button id="btnIniciarCamara" class="btn-gold" onclick="iniciarEscaner()">Abrir cámara y escanear QR</button>
    <button id="btnDetenerCamara" class="btn-outline hidden" onclick="detenerEscaner()">Detener cámara</button>
    
    <p style="text-align:center; color:#ccc; margin-top:20px;">O busca manualmente:</p>
    <input type="text" id="txtBuscar" placeholder="CLI-001 o 999888777">
    <button class="btn-outline" onclick="buscarManual()">Buscar Cliente</button>
  </div>

  <div id="pantallaAcciones" class="box hidden">
    <h2 id="lblNombre" style="text-align:center; color:var(--gold); margin-top:0;">Nombre</h2>
    
    <div class="stat-box" id="cajaCerveza">
      <h4>🍺 Cervezas</h4><p id="statCerveza">0/9</p><p id="statChopsPendientes" class="beer-pending">Sin chop gratis pendiente</p>
      <div class="grid-botones">
        <button class="btn-outline" onclick="sumar('cerveza',1)">+1</button>
        <button class="btn-outline" onclick="sumar('cerveza',2)">+2</button>
        <button class="btn-outline" onclick="sumar('cerveza',3)">+3</button>
        <button class="btn-outline" onclick="sumar('cerveza',4)">+4</button>
      </div>
    </div>
    
    <div class="stat-box">
      <h4>🍴 Menús Normales</h4><p id="statMenuN">0/20</p>
      <div class="grid-botones">
        <button class="btn-outline" onclick="sumar('menuNormal',1)">+1</button>
        <button class="btn-outline" onclick="sumar('menuNormal',2)">+2</button>
        <button class="btn-outline" onclick="sumar('menuNormal',3)">+3</button>
        <button class="btn-outline" onclick="sumar('menuNormal',4)">+4</button>
      </div>
    </div>

    <div class="stat-box" style="border-color: var(--green);">
      <h4 style="color:var(--green)">🏷️ Menús 50% Dcto</h4><p id="statMenuD" style="color:var(--green)">0/4</p>
      <button id="btnDcto" class="btn-outline" style="border-color:var(--green); color:var(--green); font-size: 1.1rem; padding: 15px;" onclick="sumar('menuDcto',1)">Aplicar 50% Dcto AHORA (+1)</button>
      <p style="color:#888; font-size:0.8rem; margin:10px 0 0 0;">Solo se activa al llegar a múltiplos de 5 en menú normal.</p>
    </div>

    <div class="cafe-admin" id="panelCafeAdmin">
      <h3>☕ Tarjeta de café</h3>
      <div id="cafeAdminEstado" class="cafe-admin-status">Consultando suscripción…</div>
      <button id="btnActivarSuscripcionCafe" class="btn-gold" onclick="activarSuscripcionCafe()">Activar suscripción (1 Mes)</button>
      <button id="btnRegistrarCafeHoy" class="btn-green hidden" onclick="registrarCafeHoy()">Registrar café de hoy</button>
    </div>
    
    <button id="btnCanjearJarra" class="btn-green hidden" onclick="canjear('chop')">Entregar chop gratis</button>
    <button id="btnCanjearPiqueo" class="btn-green hidden" onclick="canjear('piqueo')">Entregar Piqueo Gratis</button>
    <hr style="border-color:#333;"><button class="btn-outline" onclick="volver()">Buscar otro cliente</button>
  </div>
</div>

<script>
  // REEMPLAZA ESTO CON LA  DE APPS SCRIPT V5.1
  const API_URL = "https://script.google.com/macros/s/AKfycbxftzW_pIYnCtnAXT1VcaqGV86MMMpC4muvOhjSuoWzNdZ52CVlZ8WFuUcAjAiXpotM7g/exec";
  let pinActual = sessionStorage.getItem('posoqo_admin_pin') || "";
  let idCliente = null;
  let sMenuN = 0, sMenuD = 0, sCerveza = 0;
  let lectorQR = null, escanerActivo = false;

  window.onload = () => { if(pinActual) mostrar('espera'); };

  function mostrar(pantalla) {
    document.getElementById('pantallaLogin').classList.toggle('hidden', pantalla !== 'login');
    document.getElementById('pantallaEspera').classList.toggle('hidden', pantalla !== 'espera');
    document.getElementById('pantallaAcciones').classList.toggle('hidden', pantalla !== 'acciones');
  }

  async function llamarAPI(params) {
    const url = new URL(API_URL); url.searchParams.set('api', 'true');
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, String(v)));
    const inicio = performance.now();
    const res = await fetch(url.toString(), { method: 'GET', redirect: 'follow', cache: 'no-store' });
    const datos = JSON.parse(await res.text());
    console.info(`[POSOQO] ${params.accion || 'API'}: ${Math.round(performance.now() - inicio)} ms total; servidor: ${datos._msServidor ?? 'n/d'} ms`);
    return datos;
  }

  async function iniciarSesion() {
    const p = document.getElementById('txtPin').value;
    const res = await llamarAPI({ accion: 'validarPIN', pin: p });
    if(res.exito) { pinActual = p; sessionStorage.setItem('posoqo_admin_pin', p); mostrar('espera'); }
    else alert('PIN Incorrecto');
  }

  async function iniciarEscaner() {
    if (!window.Html5Qrcode) return alert('La cámara no está disponible.');
    document.getElementById('btnIniciarCamara').classList.add('hidden');
    document.getElementById('btnDetenerCamara').classList.remove('hidden');
    
    lectorQR = new Html5Qrcode('reader');
    await lectorQR.start(
      { facingMode:'environment' },
      { fps:10, qrbox:{ width:250, height:250 } },
      (texto) => {
        detenerEscaner();
        const urlMatch = texto.match(/id=(CLI-\d+)/);
        const idFinal = urlMatch ? urlMatch[1] : (texto.startsWith('CLI-') ? texto : null);
        if(idFinal) cargarCliente(idFinal);
        else alert('QR no es de POSOQO.');
      },
      () => {}
    );
    escanerActivo = true;
  }
  
  async function detenerEscaner() {
    if (lectorQR && escanerActivo) { await lectorQR.stop(); lectorQR.clear(); }
    escanerActivo = false;
    document.getElementById('btnIniciarCamara').classList.remove('hidden');
    document.getElementById('btnDetenerCamara').classList.add('hidden');
  }

  async function buscarManual() {
    const val = document.getElementById('txtBuscar').value;
    if(!val) return;
    document.querySelector('#pantallaEspera button').textContent = "Buscando...";
    const res = await llamarAPI({ accion: 'buscarCliente', busqueda: val, pin: pinActual });
    document.querySelector('#pantallaEspera button').textContent = "Buscar Cliente";
    if(res.exito) cargarCliente(res.id);
    else alert(res.mensaje);
  }

  async function cargarCliente(id) {
    const res = await llamarAPI({ accion: 'obtenerEstadoRapido', id: id, pin: pinActual });
    if(!res.exito) return alert("Error al cargar cliente.");
    idCliente = id;
    document.getElementById('lblNombre').textContent = res.cliente.nombre;
    
    actualizarEstadoCerveza(res.saldos.cerveza, false);
    
    sMenuN = res.saldos.menuNormal; 
    sMenuD = res.saldos.menuDcto;
    document.getElementById('statMenuN').textContent = `${sMenuN}/20`;
    document.getElementById('statMenuD').textContent = `${sMenuD}/4`;
    
    const dctosDisponibles = Math.floor(sMenuN / 5) - sMenuD;
    const btnDcto = document.getElementById('btnDcto');
    if (dctosDisponibles > 0 && sMenuD < 4) {
      btnDcto.disabled = false; btnDcto.style.opacity = '1';
      btnDcto.textContent = `Aplicar 50% Dcto AHORA (+1)`;
    } else {
      btnDcto.disabled = true; btnDcto.style.opacity = '0.4';
      btnDcto.textContent = `Descuento Bloqueado`;
    }

    document.getElementById('btnCanjearJarra').classList.toggle('hidden', Math.floor(Number(res.saldos.cerveza || 0) / 9) < 1);
    document.getElementById('btnCanjearPiqueo').classList.toggle('hidden', res.saldos.piqueos < 1);
    
    cargarEstadoCafeAdmin(id);
    if(res.saldos.piqueos > 0) alert(`¡ATENCIÓN! Este cliente tiene un PIQUEO GRATIS vigente hasta el ${res.saldos.vencimientoPiqueo}`);
    mostrar('acciones');
  }

  async function cargarEstadoCafeAdmin(idConsulta) {
    const estado = document.getElementById('cafeAdminEstado');
    estado.textContent = 'Consultando suscripción de café…';
    document.getElementById('btnActivarSuscripcionCafe').classList.add('hidden');
    document.getElementById('btnRegistrarCafeHoy').classList.add('hidden');
    try {
      const res = await llamarAPI({ accion: 'obtenerEstadoCafe', id: idConsulta, pin: pinActual });
      if (res.exito && idCliente === idConsulta) actualizarPanelCafeAdmin(res.cafe);
    } catch (err) {
      if (idCliente === idConsulta) estado.textContent = 'No se pudo consultar la suscripción. Vuelve a cargar el cliente.';
    }
  }

  function actualizarEstadoCerveza(total, celebrar) {
    sCerveza = Number(total) || 0;
    const resto = sCerveza % 9;
    const avanceVisible = (sCerveza > 0 && resto === 0) ? 9 : resto;
    const premios = Math.floor(sCerveza / 9);
    document.getElementById('statCerveza').textContent = `${avanceVisible}/9`;
    document.getElementById('statChopsPendientes').textContent = premios > 0
      ? `🍻 ${premios} chop(s) gratis pendiente(s) — no se pierden al seguir acumulando`
      : 'Completa 9 sellos para desbloquear un chop gratis';
    const btn = document.getElementById('btnCanjearJarra');
    btn.classList.toggle('hidden', premios < 1);
    btn.textContent = premios > 0 ? `Entregar chop gratis (${premios} disponible${premios === 1 ? '' : 's'})` : 'Entregar chop gratis';
    if (celebrar) {
      const caja = document.getElementById('cajaCerveza');
      caja.classList.remove('beer-celebrate');
      void caja.offsetWidth;
      caja.classList.add('beer-celebrate');
      setTimeout(() => caja.classList.remove('beer-celebrate'), 1800);
    }
  }

  function actualizarPanelCafeAdmin(cafe) {
    const estado = document.getElementById('cafeAdminEstado');
    const btnActivar = document.getElementById('btnActivarSuscripcionCafe');
    const btnCafe = document.getElementById('btnRegistrarCafeHoy');
    
    if (!cafe || !cafe.vigente) {
      estado.textContent = 'Sin suscripción activa.';
      btnActivar.classList.remove('hidden'); btnCafe.classList.add('hidden');
    } else {
      estado.textContent = cafe.entregadoHoy ? '☑ El café de hoy ya fue entregado.' : '✓ Suscripción vigente. Café disponible.';
      btnActivar.classList.add('hidden');
      btnCafe.classList.toggle('hidden', !!cafe.entregadoHoy);
    }
  }

  async function activarSuscripcionCafe() {
    if(!confirm(`¿Activar una suscripción mensual de café para este cliente?`)) return;
    const res = await llamarAPI({ accion:'activarSuscripcionCafe', id:idCliente, pin:pinActual });
    alert(res.mensaje); if(res.exito) cargarCliente(idCliente);
  }

  async function registrarCafeHoy() {
    if(!confirm(`¿Confirmas entregar el café de hoy? Solo uno por día.`)) return;
    const res = await llamarAPI({ accion:'registrarCafeHoy', id:idCliente, pin:pinActual });
    alert(res.mensaje); if(res.exito) volver();
  }

  async function sumar(tipo, cant) {
    if (!idCliente) return;
    let msgConfirm = `¿Registrar +${cant} a ${tipo.toUpperCase()}?`;

    if (tipo === 'menuNormal') {
      if (sMenuN === 20 && sMenuD === 4) {
        msgConfirm = `La tarjeta está LLENA. Al registrar, se reiniciará a 0 guardando el piqueo intacto.\n\n¿INICIAR NUEVA TARJETA con +${cant}?`;
      }
      else if (sMenuN === 20 && sMenuD < 4) return alert(`Falta aplicar ${4 - sMenuD} descuento(s) para completar la cartilla.`);
      else if (sMenuN + cant > 20) return alert(`La tarjeta normal se llena a los 20. Faltan ${20 - sMenuN}.`);
    }
    else if (tipo === 'menuDcto') {
      if (sMenuD + cant > 4) return alert('Máximo 4 descuentos.');
      if (cant > Math.floor(sMenuN / 5) - sMenuD) return alert('Aún no llega a la meta de 5 platos normales.');
      msgConfirm = '¿Aplicar 50% de DESCUENTO en este momento?';
    }

    if (!confirm(msgConfirm)) return;
    const cervezaAntes = sCerveza;
    const res = await llamarAPI({ accion: 'registrarConsumo', id: idCliente, tipo: tipo, cant: cant, pin: pinActual });
    alert(res.mensaje);
    if (res.exito) {
      await cargarCliente(idCliente);
      if (tipo === 'cerveza' && Math.floor((cervezaAntes + cant) / 9) > Math.floor(cervezaAntes / 9)) {
        actualizarEstadoCerveza(cervezaAntes + cant, true);
        alert('¡Brindis POSOQO! Se desbloqueó un chop gratis. Puedes seguir acumulando; el premio permanece disponible.');
      }
    }
  }
  async function canjear(tipo) {
    if(!confirm(`¿Entregar ${tipo} gratis y descontarlo de la tarjeta?`)) return;
    const res = await llamarAPI({ accion: 'canjear', id: idCliente, tipo: tipo, pin: pinActual });
    alert(res.mensaje);
    if(res.exito) cargarCliente(idCliente);
  }

  function volver() { idCliente = null; document.getElementById('txtBuscar').value=''; mostrar('espera'); }
</script>
