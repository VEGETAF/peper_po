<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>POSOQO | Terminal Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet"></noscript>
  <style>
    :root { --bg: #000; --card: #111; --gold: #F59E0B; --text: #FFF; --green:#10B981; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 14px; display: flex; justify-content: center;}
    .container { width: 100%; max-width: 440px; }
    .brand-logo { display:block; width:min(190px,70vw); height:auto; margin:0 auto; object-fit:contain; }
    .box { background: var(--card); border: 1px solid #333; border-radius: 20px; padding: 20px; margin-bottom: 20px;}
    input { width: 100%; background: #222; border: 1px solid #444; border-radius: 10px; padding: 15px; color: #FFF; text-align: center; margin-bottom: 12px; font-size: 1rem;}
    button { width: 100%; padding: 13px; border-radius: 10px; font-weight: 800; border: none; cursor: pointer; font-size: .95rem; margin-bottom: 10px; }
    .btn-gold { background: var(--gold); color: #000; }
    .btn-outline { background: transparent; border: 1px solid #555; color: #FFF; }
    .btn-green { background: var(--green); color: #000; padding: 15px;}
    .stat-box { background: #222; padding: 15px; border-radius: 10px; text-align: center; border: 1px dashed #555; margin-bottom: 15px;}
    .beer-pending { color:#ffc65b; font-size:.82rem; font-weight:800; margin:0 0 10px; }
    .beer-celebrate { animation: beerCelebrate .8s ease 2; border-color:#f5a623 !important; box-shadow:0 0 22px rgba(245,166,35,.35); }
    @keyframes beerCelebrate { 0%,100%{transform:scale(1)} 45%{transform:scale(1.025)} 70%{transform:scale(.99)} }
    .stat-box h4 { margin: 0 0 5px 0; color: var(--gold); font-size: 1.1rem; }
    .stat-box p { margin: 0 0 10px 0; font-size: 1.5rem; font-weight: 800; }
    .grid-botones { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .cafe-admin { padding: 15px; border: 1px solid #6d4a12; border-radius: 14px; background: #0c0c0c; margin-bottom: 15px;}
    .cafe-admin h3 { margin: 0 0 8px; color: var(--gold); font-size: 1.02rem; }
    .cafe-admin-status { padding: 10px; border-radius: 10px; font-size: .82rem; background: #202020; color: #eee; margin-bottom: 10px; }
    #reader { width:100%; overflow:hidden; border-radius:14px; background:#050505; margin:12px 0; }
    .hidden { display: none !important; }
  </style>
</head>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxftzW_pIYnCtnAXT1VcaqGV86MMMpC4muvOhjSuoWzNdZ52CVlZ8WFuUcAjAiXpotM7g/exec";
  const QR_LIBRARY_URL = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
  const $ = (id) => document.getElementById(id);
  let pinActual = sessionStorage.getItem('posoqo_admin_pin') || "";
  let idCliente = null;
  let sMenuN = 0, sMenuD = 0, sCerveza = 0;
  let lectorQR = null, escanerActivo = false, qrLibraryPromise = null;
  let solicitudClienteEnCurso = false;

  window.addEventListener('DOMContentLoaded', () => { if(pinActual) mostrar('espera'); });

  function mostrar(pantalla) {
    $('pantallaLogin').classList.toggle('hidden', pantalla !== 'login');
    $('pantallaEspera').classList.toggle('hidden', pantalla !== 'espera');
    $('pantallaAcciones').classList.toggle('hidden', pantalla !== 'acciones');
  }

  async function llamarAPI(params) {
    const url = new URL(API_URL);
    url.searchParams.set('api', 'true');
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, String(v)));
    const inicio = performance.now();
    const controlador = new AbortController();
    const limite = setTimeout(() => controlador.abort(), 15000);
    try {
      const respuesta = await fetch(url.toString(), {
        method: 'GET', redirect: 'follow', cache: 'no-store', signal: controlador.signal
      });
      const texto = await respuesta.text();
      let datos;
      try { datos = JSON.parse(texto); }
      catch (_) { throw new Error('El servidor no devolvió JSON. Revisa que Code.gs V5.8 esté implementado.'); }
      datos._msCliente = Math.round(performance.now() - inicio);
      console.info(`[POSOQO] ${params.accion}: ${datos._msCliente} ms total; servidor: ${datos._msServidor ?? 'sin medición'} ms`);
      return datos;
    } catch (error) {
      if (error.name === 'AbortError') throw new Error('La consulta superó 15 segundos. Comprueba la conexión o el servicio de Apps Script.');
      throw error;
    } finally { clearTimeout(limite); }
  }

  async function iniciarSesion() {
    const p = $('txtPin').value.trim();
    if (!p) return alert('Ingresa el PIN del personal.');
    try {
      const res = await llamarAPI({ accion: 'validarPIN', pin: p });
      if(res.exito) { pinActual = p; sessionStorage.setItem('posoqo_admin_pin', p); mostrar('espera'); }
      else alert('PIN incorrecto.');
    } catch (err) { alert(err.message); }
  }

  function cargarBibliotecaQR() {
    if (window.Html5Qrcode) return Promise.resolve();
    if (qrLibraryPromise) return qrLibraryPromise;
    qrLibraryPromise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = QR_LIBRARY_URL;
      script.async = true;
      script.onload = () => window.Html5Qrcode ? resolve() : reject(new Error('No se pudo iniciar la biblioteca QR.'));
      script.onerror = () => reject(new Error('No se pudo descargar el lector QR. Comprueba tu conexión.'));
      document.head.appendChild(script);
    });
    return qrLibraryPromise;
  }

  async function iniciarEscaner() {
    try {
      await cargarBibliotecaQR();
      $('btnIniciarCamara').classList.add('hidden');
      $('btnDetenerCamara').classList.remove('hidden');
      lectorQR = new Html5Qrcode('reader');
      await lectorQR.start(
        { facingMode:'environment' },
        { fps:10, qrbox:{ width:250, height:250 } },
        async (texto) => {
          await detenerEscaner();
          const urlMatch = texto.match(/id=(CLI-\d+)/i);
          const idFinal = urlMatch ? urlMatch[1].toUpperCase() : (texto.trim().match(/^CLI-\d+$/i) ? texto.trim().toUpperCase() : null);
          if(idFinal) await cargarCliente(idFinal);
          else alert('El QR no corresponde a un cliente POSOQO.');
        },
        () => {}
      );
      escanerActivo = true;
    } catch (err) {
      $('btnIniciarCamara').classList.remove('hidden');
      $('btnDetenerCamara').classList.add('hidden');
      alert('No se pudo activar el lector: ' + err.message);
    }
  }

  async function detenerEscaner() {
    try {
      if (lectorQR && escanerActivo) { await lectorQR.stop(); lectorQR.clear(); }
    } catch (_) {}
    escanerActivo = false;
    $('btnIniciarCamara').classList.remove('hidden');
    $('btnDetenerCamara').classList.add('hidden');
  }

  async function buscarManual() {
    const val = $('txtBuscar').value.trim();
    if (!val || solicitudClienteEnCurso) return;
    const boton = $('btnBuscarCliente');
    solicitudClienteEnCurso = true;
    boton.disabled = true; boton.textContent = 'Buscando cliente…';
    try {
      // Una sola ida al servidor: busca por ID o celular y devuelve la ficha y saldos.
      const res = await llamarAPI({ accion: 'buscarYObtenerEstadoRapido', busqueda: val, pin: pinActual });
      if (res.exito) mostrarCliente(res);
      else alert(res.mensaje || 'No se encontró el cliente.');
    } catch (err) { alert(err.message); }
    finally { solicitudClienteEnCurso = false; boton.disabled = false; boton.textContent = 'Buscar Cliente'; }
  }

  async function cargarCliente(id) {
    if (solicitudClienteEnCurso) return;
    solicitudClienteEnCurso = true;
    try {
      const res = await llamarAPI({ accion: 'obtenerEstadoRapido', id: id, pin: pinActual });
      if (!res.exito) return alert(res.mensaje || 'No se pudo cargar el cliente.');
      mostrarCliente(res, id);
    } catch (err) { alert(err.message); }
    finally { solicitudClienteEnCurso = false; }
  }

  function mostrarCliente(res, idForzado) {
    const id = idForzado || res.id;
    if (!res || !res.exito || !id) return alert('La respuesta del servidor está incompleta.');
    idCliente = id;
    $('lblNombre').textContent = res.cliente.nombre;
    $('lblTiempoCarga').textContent = `Ficha: ${res._msCliente ?? '—'} ms · servidor: ${res._msServidor ?? '—'} ms`;

    actualizarEstadoCerveza(res.saldos.cerveza, false);
    sMenuN = Number(res.saldos.menuNormal) || 0;
    sMenuD = Number(res.saldos.menuDcto) || 0;
    $('statMenuN').textContent = `${sMenuN}/20`;
    $('statMenuD').textContent = `${sMenuD}/4`;

    const dctosDisponibles = Math.floor(sMenuN / 5) - sMenuD;
    const btnDcto = $('btnDcto');
    if (dctosDisponibles > 0 && sMenuD < 4) {
      btnDcto.disabled = false; btnDcto.style.opacity = '1';
      btnDcto.textContent = 'Aplicar 50% Dcto AHORA (+1)';
    } else {
      btnDcto.disabled = true; btnDcto.style.opacity = '0.4';
      btnDcto.textContent = 'Descuento Bloqueado';
    }

    $('btnCanjearPiqueo').classList.toggle('hidden', Number(res.saldos.piqueos) < 1);
    if (Number(res.saldos.piqueos) > 0) {
      $('btnCanjearPiqueo').title = 'Vence: ' + (res.saldos.vencimientoPiqueo || 'fecha no informada');
    }
    mostrar('acciones');
    // La consulta de café arranca DESPUÉS de mostrar los datos principales y no bloquea la ficha.
    cargarEstadoCafeAdmin(id);
    if (Number(res.saldos.piqueos) > 0) {
      console.info('[POSOQO] Cliente tiene piqueo pendiente; vence: ' + res.saldos.vencimientoPiqueo);
    }
  }

  async function cargarEstadoCafeAdmin(idConsulta) {
    const estado = $('cafeAdminEstado');
    estado.textContent = 'Consultando suscripción de café…';
    $('btnActivarSuscripcionCafe').classList.add('hidden');
    $('btnRegistrarCafeHoy').classList.add('hidden');
    try {
      const res = await llamarAPI({ accion: 'obtenerEstadoCafe', id: idConsulta, pin: pinActual });
      if (res.exito && idCliente === idConsulta) actualizarPanelCafeAdmin(res.cafe);
      else if (idCliente === idConsulta) estado.textContent = res.mensaje || 'No se pudo consultar café.';
    } catch (err) {
      if (idCliente === idConsulta) estado.textContent = 'No se pudo consultar café. ' + err.message;
    }
  }

  function actualizarEstadoCerveza(total, celebrar) {
    sCerveza = Number(total) || 0;
    const resto = sCerveza % 9;
    const avanceVisible = (sCerveza > 0 && resto === 0) ? 9 : resto;
    const premios = Math.floor(sCerveza / 9);
    $('statCerveza').textContent = `${avanceVisible}/9`;
    $('statChopsPendientes').textContent = premios > 0
      ? `🍻 ${premios} chop(s) gratis pendiente(s)`
      : 'Completa 9 sellos para desbloquear un chop gratis';
    const btn = $('btnCanjearJarra');
    btn.classList.toggle('hidden', premios < 1);
    btn.textContent = premios > 0 ? `Entregar chop gratis (${premios} disponible${premios === 1 ? '' : 's'})` : 'Entregar chop gratis';
    if (celebrar) {
      const caja = $('cajaCerveza');
      caja.classList.remove('beer-celebrate'); void caja.offsetWidth; caja.classList.add('beer-celebrate');
      setTimeout(() => caja.classList.remove('beer-celebrate'), 1800);
    }
  }

  function actualizarPanelCafeAdmin(cafe) {
    const estado = $('cafeAdminEstado');
    const btnActivar = $('btnActivarSuscripcionCafe');
    const btnCafe = $('btnRegistrarCafeHoy');
    if (!cafe || !cafe.vigente) {
      estado.textContent = 'Sin suscripción activa.';
      btnActivar.classList.remove('hidden'); btnCafe.classList.add('hidden');
    } else {
      estado.textContent = cafe.entregadoHoy ? '☑ El café de hoy ya fue entregado.' : '✓ Suscripción vigente. Café disponible.';
      btnActivar.classList.add('hidden');
      btnCafe.classList.toggle('hidden', !!cafe.entregadoHoy);
    }
  }

  async function activarSuscripcionCafe() {
    if(!confirm('¿Activar una suscripción mensual de café para este cliente?')) return;
    try {
      const res = await llamarAPI({ accion:'activarSuscripcionCafe', id:idCliente, pin:pinActual });
      alert(res.mensaje); if(res.exito) cargarEstadoCafeAdmin(idCliente);
    } catch (err) { alert(err.message); }
  }

  async function registrarCafeHoy() {
    if(!confirm('¿Confirmas entregar el café de hoy? Solo uno por día.')) return;
    try {
      const res = await llamarAPI({ accion:'registrarCafeHoy', id:idCliente, pin:pinActual });
      alert(res.mensaje); if(res.exito) volver();
    } catch (err) { alert(err.message); }
  }

  async function sumar(tipo, cant) {
    if (!idCliente) return;
    let msgConfirm = `¿Registrar +${cant} a ${tipo.toUpperCase()}?`;
    if (tipo === 'menuNormal') {
      if (sMenuN === 20 && sMenuD === 4) {
        msgConfirm = `La tarjeta está LLENA. Al registrar, se reiniciará a 0 guardando el piqueo intacto.\\n\\n¿INICIAR NUEVA TARJETA con +${cant}?`;
      } else if (sMenuN === 20 && sMenuD < 4) return alert(`Falta aplicar ${4 - sMenuD} descuento(s) para completar la cartilla.`);
      else if (sMenuN + cant > 20) return alert(`La tarjeta normal se llena a los 20. Faltan ${20 - sMenuN}.`);
    } else if (tipo === 'menuDcto') {
      if (sMenuD + cant > 4) return alert('Máximo 4 descuentos.');
      if (cant > Math.floor(sMenuN / 5) - sMenuD) return alert('Aún no llega a la meta de 5 platos normales.');
      msgConfirm = '¿Aplicar 50% de DESCUENTO en este momento?';
    }
    if (!confirm(msgConfirm)) return;
    const cervezaAntes = sCerveza;
    try {
      const res = await llamarAPI({ accion: 'registrarConsumo', id: idCliente, tipo: tipo, cant: cant, pin: pinActual });
      alert(res.mensaje);
      if (res.exito) {
        await cargarCliente(idCliente);
        if (tipo === 'cerveza' && Math.floor((cervezaAntes + cant) / 9) > Math.floor(cervezaAntes / 9)) {
          actualizarEstadoCerveza(cervezaAntes + cant, true);
          alert('¡Brindis POSOQO! Se desbloqueó un chop gratis. Puedes seguir acumulando; el premio permanece disponible.');
        }
      }
    } catch (err) { alert(err.message); }
  }

  async function canjear(tipo) {
    if(!confirm(`¿Entregar ${tipo} gratis y descontarlo de la tarjeta?`)) return;
    try {
      const res = await llamarAPI({ accion: 'canjear', id: idCliente, tipo: tipo, pin: pinActual });
      alert(res.mensaje);
      if(res.exito) await cargarCliente(idCliente);
    } catch (err) { alert(err.message); }
  }

  function volver() { idCliente = null; $('txtBuscar').value=''; $('lblTiempoCarga').textContent=''; mostrar('espera'); }
</script>
</body>
</html>
